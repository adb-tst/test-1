version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: s1-test
    os_image: ''
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
blocks:
  - name: "\U0001F9EA Test"
    dependencies: []
    task:
      secrets:
        - name: sample-org-secret
        - name: sample-project-secret
        - name: rsv-test-reserved
        - name: project secret
      jobs:
        - name: "\U0001F7E2 Run Tests"
          commands:
            - echo "Checking out code..."
            - echo "Installing dependencies..."
            - echo "Running test suite..."
            - echo "Tests completed successfully!"
        - name: OIDC TOKEN PAYLOAD
          commands:
            - PAYLOAD=$(echo $SEMAPHORE_OIDC_TOKEN | cut -d "." -f 2 | base64 -d | jq . 2>/dev/null) || true
            - echo "OIDC Payload=$PAYLOAD"
        - name: Secrets
          commands:
            - echo "org=$SAMPLE_ORG_TOKEN ($SAMPLE_ORG_ENV)"
            - echo "project=$SAMPLE_PROJECT_TOKEN ($SAMPLE_PROJECT_ENV)"
            - 'echo $NORMAL_VAR >> secret_file '
            - echo $PROJECT_SECRET >> secret_file
            - cat secret_file
